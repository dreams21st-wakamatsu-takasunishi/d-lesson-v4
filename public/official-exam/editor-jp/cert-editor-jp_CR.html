    <script type="text/javascript">
      var composition = true; // IME入力監視
      var imeFlag = false; // IME入力フラグ
      var postLineNum = 0; // 文字入力直前の行数
      var keyCode = -1;    // キーコード
      // 定数
      const INPUT_MODE = "kana"; // 入力モード
      const TAB_COUNT = 5;
      const MAX_CHAR_NUM = 40; // 1行の最大文字数
      const MAX_LENGTH = 1477; // 1シートの最大文字数(line(40*36line) + newLine(1*36line) + event(1))
      const MAX_LINE_NUM = 36; // 1シートの最大行数

      // ADD Start 入力文字数カウンタ初期表示
      document.getElementsByClassName("letr-cnt")[0].innerHTML = FRST_DISP_CNT;
      // ADD End-- 入力文字数カウンタ初期表示

      // 画面表示時の初期フォーカス
      document.getElementsByClassName("userinput")[0].focus();
      
      // ADD Start 20210108 mnt F5キー無効化
      window.document.onkeydown = function(event){
        if(event.key == "F5" ){
          event.preventDefault();
        }
      }
      // ADD End-- 20210108 mnt F5キー無効化

      $(function () {

        /* IME入力開始 */
        $(".book").on("compositionstart", function (e) {
          composition = false;
        });

        /* IME入力終了 */
        $(".book").on("compositionend", function (e) {
          composition = true;
          imeFlag = true;
          inputTextarea(e);
        });

        $(".book").on("keydown", "textarea", function (e) {
          var elem = e.target;
          var val = elem.value;
          var len = val.length;
          var pos = elem.selectionStart;

          var no = parseInt(elem.getAttribute("data-page"));
          var textareas = document.getElementsByClassName("userinput");

          keyCode = e.keyCode;
          if (keyCode === BS_KCD) {
            // back space
            var previous = textareas[no - 1];
            if (
              previous !== undefined &&
              pos == 0 &&
              pos == elem.selectionEnd
            ) {
              e.preventDefault();
              backspaceKeydown(textareas, no);
            } else {
              var result = getLastLineNumber(elem);
              postLineNum = result[0];
            }
            // ADD Start 入力文字数カウンタ
            DispLetterCount(textareas);
            // ADD End-- 入力文字数カウンタ
          } else if (keyCode === TAB_KCD) {
            // tab
            e.preventDefault();
            // 文字の間にタブ
            // MOD Start タブを空白５文字に置換
            // elem.value = val.substr(0, pos) + '\t' + val.substr(pos, val.length);
            elem.value = val.substr(0, pos) + FULL_SPACE.repeat(TAB_COUNT) + val.substr(pos, val.length);
            // MOD End-- タブを空白５文字に置換
            // MOD Start タブの位置
            // elem.setSelectionRange(pos + 1, pos + 1);
            elem.setSelectionRange(pos + TAB_COUNT, pos + TAB_COUNT);
            // MOD End-- タブの位置
            inputTextarea(e);
          } else if (e.keyCode === LFT_KCD) {
            // left arrow
            var previous = textareas[no - 1];
            if (previous !== undefined && pos == 0) {
              e.preventDefault();
              var result = getLastLineNumber(previous);
              var num = result[0];
              pos = previous.value.length;
              if (num > MAX_LINE_NUM) {
                pos -= 1;
              }
              previous.focus();
              previous.setSelectionRange(pos, pos);
            }
          } else if (keyCode === UP_KCD) {
            // top arrow
            var previous = textareas[no - 1];
            var result = function () {
              // 先頭行でキー押下されたか判定
              var firstLen = val.split("\n")[0].length;
              firstLen = firstLen >= MAX_CHAR_NUM ? MAX_CHAR_NUM - 1 : firstLen;
              return pos >= 0 && pos <= firstLen;
            };
            if (previous !== undefined && result()) {
              e.preventDefault();
              var result = getLastLineNumber(previous);
              var ary = result[1];
              var endLen = ary[MAX_LINE_NUM - 1].join("").length;
              var startPos = previous.value.length - endLen;
              pos = startPos + (pos > endLen ? endLen - 1 : pos);
              previous.focus();
              previous.setSelectionRange(pos, pos);
            }
          } else if (keyCode === RGT_KCD) {
            // right arrow
            var next = textareas[no + 1];
            var result = function () {
              // 最終行の行末でキー押下されたか判定
              var result = getLastLineNumber(elem);
              var num = result[0];
              return (
                (num > MAX_LINE_NUM && pos == val.length - 1) ||
                (num == MAX_LINE_NUM && pos == val.length)
              );
            };
            if (next !== undefined && result()) {
              e.preventDefault();
              next.focus();
              next.setSelectionRange(0, 0);
            }
          } else if (keyCode === DWN_KCD) {
            // down arrow
            var next = textareas[no + 1];
            var begin;
            var result = function () {
              // 最終行でキー押下されたか判定
              var result = getLastLineNumber(elem);
              var ary = result[1];
              begin = len - ary[MAX_LINE_NUM - 1].join("").length;
              return pos >= begin && pos <= len;
            };
            if (next !== undefined && result()) {
              e.preventDefault();
              var result = getLastLineNumber(next);
              var ary = result[1];
              firstLine = ary[0].join("");
              var firstLen = firstLine.length;
              if (checkNewLine(firstLine.slice(-1))) {
                firstLen -= 1;
              }
              var startPos = pos - begin;
              pos = startPos >= firstLen ? firstLen : startPos;
              next.focus();
              next.setSelectionRange(pos, pos);
            }
          } else if (keyCode === DEL_KCD) {
            // delete
            var next = textareas[no + 1];
            if (
              next !== undefined &&
              pos == val.length &&
              pos == elem.selectionEnd
            ) {
              e.preventDefault();
              deleteKeydown(textareas, no);

              // 最終頁の削除
              var text = textareas[textareas.length - 1];
              if (text.value.length == 0) {
                var section = text.parentNode.parentNode;
                section.parentNode.removeChild(section);
              }
            } else {
              var result = getLastLineNumber(elem);
              postLineNum = result[0];
            }
            // ADD Start 入力文字数カウンタ
            DispLetterCount(textareas);
            // ADD End-- 入力文字数カウンタ

          /* ADD Start 半角空白禁止 */
          // } else if (keyCode === SP_KCD || keyCode === SHFTSP_KCD) {
          } else if (keyCode === SP_KCD) {
            // half-space
            e.preventDefault();
            elem.value = val.substr(0, pos) + FULL_SPACE + val.substr(pos, val.length);
            elem.setSelectionRange(pos + 1, pos + 1);
          /* ADD End-- 半角空白禁止 */
          }

          /* ADD Start タブレイアウト */
          var ary = [];
          var r = getLastLineNumber(elem);
          ary = r[1];
          var la = ary.length; // ary 配列の長さ
          var si = "";
          var sj = "";
          var sk = "";
          var f = false;
          var half_space = "\x20";
          for(var i = 0, j = 0; i < la; i++){
              ary[i] = ary[i].join("");
              si = ary[i].slice(-1);
              sk = ary[i].slice(0,-1);
              sj = sk.slice(-1);
              if(si === "\n" && (sj === half_space || sj === "\t")){
                // 末尾の半角空白・タブを削除
                ary[i] = sk.replace(new RegExp(half_space + '+$', 'g'), "").replace(/\t+$/g, "")
                           .replace(new RegExp(half_space + '+$', 'g'), "").replace(/\t+$/g, "");
                // 削除した文字数分のカーソル位置を戻す。
                sk = sk.replace(ary[i], "");
                pos -= sk.length;
                ary[i] = ary[i] + "\n";
                f = true;
              }
          }
          if(f){
            elem.value = ary.join("");
            elem.setSelectionRange(pos, pos);
          }
          /* ADD End-- タブレイアウト */

        });
      });
      
      /**
       * 行の押上処理
       *
       * @param {*} pages
       * @param {*} no
       * @param {*} lineNum
       * @author mrt
       */
      function pushUpRow(pages, no, lineNum) {
        var elem = pages[no];
        var len = elem.value.length;
        var pos = elem.selectionStart;

        var result = function () {
          var words = elem.value.split("\n");
          var endLine = words[words.length - 1];
          var endPos = pos >= len - endLine.length && pos <= len;
          return endPos && !checkNewLine(elem.value.slice(-1));
        };
        if (postLineNum > lineNum || result()) {
          // 行数が減る or 頁跨ぎの連続文字を最終行でDel/BSキーで減らす
          deleteChar(pages, no, postLineNum - lineNum);
          elem.focus();
          elem.setSelectionRange(pos, pos);

          if (pages[pages.length - 1].value.length == 0) {
            var section = pages[pages.length - 1].parentNode.parentNode;
            section.parentNode.removeChild(section);
          }
        }
      }

      /**
       * 次頁文字削除
       *
       * @param {*} pages
       * @param {*} no
       * @param {*} diff
       * @author mrt
       */
      function deleteChar(pages, no, diff) {
        var page = pages[no];
        var next = pages[no + 1];

        var result = getLastLineNumber(next);
        var num = result[0];
        var ary = result[1];
        for (var i = 0; i < (diff <= 0 ? 1 : diff); i++) {
          if (ary[i] === undefined) {
            break;
          }
          var line = ary[i].join("");
          page.value = page.value + line;
          var nextVal = next.value;
          next.value = nextVal.substring(line.length, nextVal.length);
        }
        // 編集後の頁情報を取得
        result = getLastLineNumber(page);
        num = result[0];
        ary = result[1];
        if (num > MAX_LINE_NUM) {
          writeNextSheet(pages, no, ary);
        }

        if (pages[no + 2] !== undefined) {
          deleteChar(pages, no + 1, diff);
        }
      }

      /**
       * 次頁書込み処理
       *
       * @param {*} pages
       * @param {*} no
       * @param {*} ary
       * @author mrt
       */
      function writeNextSheet(pages, no, ary) {
        var next = pages[no + 1];
        if (next === undefined) {
          // 新規頁作成
          next = createNextSheet(no + 1);
        }

        // 次頁書込み
        var elem = pages[no];
        var pos = elem.selectionStart;
        var len = elem.value.length;
        var endLine = "";
        for (var i = MAX_LINE_NUM; i < ary.length; i++) {
          endLine += ary[i].join("");
        }
        next.value = endLine + next.value;
        elem.value = elem.value.substr(0, len - endLine.length);

        // フォーカス設定
        var focusArea = null;
        var resetPos = 0;
        if (pos >= len - endLine.length && pos <= len) {
          focusArea = next;
          if (imeFlag) {
            resetPos = endLine.length;
          }
        } else {
          focusArea = elem;
          resetPos = pos;
        }

        // 後続ページの対応
        imeFlag = false;
        var result = getLastLineNumber(next);
        var num = result[0];
        var ary = result[1];
        if (num > MAX_LINE_NUM) {
          writeNextSheet(pages, no + 1, ary);
        }
        focusArea.focus();
        focusArea.setSelectionRange(resetPos, resetPos);
      }

      /**
       * 新規頁作成処理
       *
       * @param {*} nextNo
       * @returns
       * @author mrt
       */
      function createNextSheet(nextNo) {
        const s = document.createElement("section");
        const d = document.createElement("div");
        const view = document.createElement("div");
        const t = document.createElement("textarea");

        s.className = "sheet";
        d.className = "editor";
        t.className = "userinput";
        t.setAttribute("data-page", nextNo);
        t.inputmode = INPUT_MODE;
        t.maxLength = MAX_LENGTH;
        t.spellcheck = false;
        t.addEventListener("input", function (e) {
          inputTextarea(e);
        });

        // 罫線の設定
        view.className = "normal-line";
        if (document.getElementsByClassName("under-line").length > 0) {
          view.className = "under-line";
        } else if (document.getElementsByClassName("grid-line").length > 0) {
          view.className = "grid-line";
        }

        d.appendChild(t);
        /* ADD Start 20220411 yok rev107b 入力エリア左右位置調整 */
        d.appendChild(view);
        /* ADD End   20220411 yok rev107b 入力エリア左右位置調整 */
        s.appendChild(d);
        /* DEL Start 20220411 yok rev107b 入力エリア左右位置調整 */
        // s.appendChild(view);
        /* DEL End   20220411 yok rev107b 入力エリア左右位置調整 */
        document.getElementsByClassName("book")[0].appendChild(s);

        return t;
      }

      /**
       * 行数の取得処理
       *
       * @param {*} elem イベント
       * @author mrt
       */
      function getLastLineNumber(elem) {
        // 行列の宣言
        row = new Array(MAX_CHAR_NUM + 1);
        ary = new Array();

        var count = 0;
        var num = 1;
        var letters = elem.value.split("");

        for (var i = 0; i < letters.length; i++) {
          var letter = letters[i];
          if (checkNewLine(letter)) {
            row[count] = letter;
            ary.push(row);
            row = new Array(MAX_CHAR_NUM + 1);
            num++;
            count = 0;
          } else {
            if (letter == "\t") {
              if (count < MAX_CHAR_NUM) {
                var temp =
                  count % TAB_COUNT == 0
                    ? TAB_COUNT
                    : TAB_COUNT - (count % TAB_COUNT);
                row[count] = letter;
                count += temp;
              } else {
                row[count] = letter;
                count++;
                if(num >= MAX_LINE_NUM) {
                  ary.push(row);
                  row = new Array(MAX_CHAR_NUM + 1);
                  num++;
                }
              }
            } else {
              if (count >= MAX_CHAR_NUM) {
                ary.push(row);
                row = new Array(MAX_CHAR_NUM + 1);
                num++;
                count = 0;
              }
              row[count] = letter;
              count++;
            }
          }
        }

        if (row.length > 0) {
          ary.push(row);
        }

        return [num, ary];
      }

      /**
       * デリート（キーダウン）
       *
       * @param {*} text
       * @param {*} no
       * @author mrt
       */
      function deleteKeydown(text, no) {
        var page = text[no];
        var next = text[no + 1];
        var val = page.value;
        var len = val.length;
        var nextVal = next.value;
        var nextLen = nextVal.length;

        var result = getLastLineNumber(next);
        var post = result[0];
        var ary = result[1];

        var line = ary[0].join("");
        var line2 = line.substring(1, line.length);
        page.value = val + line2;
        next.value = nextVal.substring(line.length, nextVal.length);

        result = getLastLineNumber(page);
        num = result[0];
        ary = result[1];
        if (num > MAX_LINE_NUM) {
          writeNextSheet(text, no, ary);
        }

        if (text[no + 2] !== undefined) {
          deleteKeydown(text, no + 1);
        }

        if (post > MAX_LINE_NUM) {
          page.focus();
          page.setSelectionRange(page.value.length, page.value.length);
        } else {
          next.focus();
          next.setSelectionRange(0, 0);
        }
      }

      /**
       * バックスペース（キーダウン）
       *
       * @param {*} text
       * @param {*} no
       */
      function backspaceKeydown(text, no) {
        var page = text[no];
        var previous = text[no - 1];
        var val = page.value;
        var preVal = previous.value;

        // BackSpace分、1文字長さを引いておく
        var preLen = preVal.length - 1;

        var result = getLastLineNumber(page);
        var num = result[0];
        var ary = result[1];

        result = getLastLineNumber(previous);
        var post = result[0];

        var line = ary[0].join("");
        previous.value = preVal.substring(0, preVal.length - 1) + line;
        page.value = val.substring(line.length, val.length);

        result = getLastLineNumber(previous);
        num = result[0];
        ary = result[1];
        if (num > MAX_LINE_NUM) {
          writeNextSheet(text, no - 1, ary);
        }

        if (text[no + 1] !== undefined) {
          backspaceKeydown(text, no + 1);
        }

        previous.focus();
        previous.setSelectionRange(preLen, preLen);

        // 最終頁の削除
        if (text[text.length - 1].value.length == 0) {
          var section = text[text.length - 1].parentNode.parentNode;
          section.parentNode.removeChild(section);
        }
      }

      /**
       * 改行チェック
       *
       * @param char 文字
       * @return 結果
       * @author mrt
       */
      function checkNewLine(char) {
        if (char == "\r" || char == "\n" || char == "\r\n") {
          return true;
        }
        return false;
      }

      /**
       * 入力イベント
       *
       * @param {*} e
       * @author mrt
      */
      function inputTextarea(e) {
        var elem = e.target;
        var no = parseInt(elem.getAttribute("data-page"));
        var pages = document.getElementsByClassName("userinput");

        // 行数取得
        var result = getLastLineNumber(elem);
        var lineNum = result[0];
        var ary = result[1];

        if (keyCode === BS_KCD || keyCode === DEL_KCD) {
          if (pages[no + 1] !== undefined) {
            pushUpRow(pages, no, lineNum);
          }
        } else if (composition) {
          if (lineNum > MAX_LINE_NUM) {
            writeNextSheet(pages, no, ary);
          }
        }

        // ADD Start 入力文字数カウンタ
        DispLetterCount(pages);
        // ADD End   入力文字数カウンタ
      }
